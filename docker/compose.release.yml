# Self-contained install: compose.yml, Caddyfile and .env live side by side in
# /opt/nodock. Nothing here references the source tree, because a user installing
# nodock does not have one.
#
# Two docker networks, and the split is the point:
#   edge     (nodock)          caddy + app containers
#   control  (nodock_control)  caddy + nodock only
#
# nodock is not on `edge`, so a deployed app cannot reach the panel API or the
# proxy's admin API. Caddy's admin is a unix socket shared through `caddy_admin`,
# so there is no TCP admin listener to reach even if the networks were wrong.
services:
  caddy:
    image: caddy:2.10-alpine
    ports: ['80:80', '443:443', '443:443/udp']
    env_file: ./.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_admin:/run/caddy
      # Static sites: the same volume nodock writes, mounted where Caddy reads it.
      # Read-only on purpose — the proxy has no business writing to a build artifact.
      - nodock_artifacts:/srv/artifacts:ro
    networks: [edge, control]
    restart: unless-stopped

  nodock:
    # NODOCK_IMAGE lets scripts/self-update.sh pin an exact build (and roll back to one).
    image: ${NODOCK_IMAGE:-ghcr.io/malshaer03/nodock:${NODOCK_VERSION:-latest}}
    env_file: ./.env
    environment:
      DATA_DIR: /data
      DOCKER_CONFIG: /data/docker
      CADDY_ADMIN_SOCKET: /run/caddy/admin.sock
      CADDY_PROBE_URL: http://caddy:8099
    volumes:
      - nodock_data:/data
      - nodock_artifacts:/data/artifacts
      - caddy_admin:/run/caddy
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [control]
    depends_on: [caddy]
    restart: unless-stopped
    mem_limit: 300m

networks:
  edge:
    name: nodock
  control:
    name: nodock_control

volumes:
  caddy_data: {}
  caddy_config: {}
  caddy_admin: {}
  nodock_data: {}
  nodock_artifacts: {}
