# Dev: API runs with `bun --watch` in this container, Vite proxies /api, /auth,
# /webhooks to it, and app containers join the same `nodock` (edge) network so
# name-based routing behaves exactly as in production.
#
# The networks and the admin socket are wired exactly like production, so the
# deploy path exercised here is the one that ships:
#   edge (nodock) + control (nodock_control); admin only over caddy_admin.
services:
  caddy:
    image: caddy:2.10-alpine
    ports: ['8080:80']
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_dev_data:/data
      - caddy_admin:/run/caddy
    networks: [edge, control]
    restart: unless-stopped

  nodock:
    image: oven/bun:1-alpine
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun --smol --watch apps/server/src/index.ts"
    env_file: ../.env
    environment:
      DATA_DIR: /data
      DOCKER_CONFIG: /data/docker
      PORT: '3000'
      CADDY_ADMIN_SOCKET: /run/caddy/admin.sock
      CADDY_PROBE_URL: http://caddy:8099
    ports: ['3000:3000']
    volumes:
      - ..:/app
      - nodock_dev_data:/data
      - caddy_admin:/run/caddy
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [control]
    restart: unless-stopped

networks:
  edge:
    name: nodock
  control:
    name: nodock_control

volumes:
  caddy_dev_data: {}
  caddy_admin: {}
  nodock_dev_data: {}
